name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref at a time: a newer push supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS, so govulncheck also analyses the darwin-only Keychain code.
  deps:
    name: deps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Every dependency, test-only ones included, must carry a permissive
      # licence. go-licenses fails on a standard-library package unless GOROOT
      # is set explicitly. A module licensed under several terms passes when
      # each of them is on the list.
      - name: Check licences
        env:
          ALLOWED_LICENSES: Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MIT-0,Zlib,Unlicense,CC0-1.0,Unicode-3.0,BSL-1.0
        run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 \
            check ./... --include_tests --allowed_licenses="$ALLOWED_LICENSES"

  # macOS as well as Linux: the Keychain store only builds on darwin.
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          unformatted="$(git ls-files -z '*.go' | grep -zvE '(^|/)vendor/' | xargs -0 gofmt -l 2>&1)"
          echo "$unformatted"
          test -z "$unformatted"
      - run: go vet -mod=vendor ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor -race ./...

  # macOS, so the darwin-only Keychain code counts.
  coverage:
    name: coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # `-coverprofile` ignores the binary that cmd/toolward's TestMain builds
      # and runs; with TOOLWARD_COVERDIR set it builds that binary with `-cover`.
      - run: |
          TOOLWARD_COVERDIR="$PWD/covdata" go test -mod=vendor -coverprofile=coverage.out ./...
          go tool covdata textfmt -i=covdata -o coverage-bin.out
          tail -n +2 coverage-bin.out >> coverage.out
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          # Coverage is a signal, not a gate.
          fail_ci_if_error: false

  # Advisory, like the Rust mutants job it replaces: a surviving mutant is a
  # hint to read, not a failure. Pull requests mutate only the changed lines;
  # pushes to main mutate the whole module. The efficacy threshold and the
  # `vendor/` exclusion live in .gremlins.yaml: gremlins v0.6.0 ignores
  # `--threshold-efficacy` on the command line, so never pass it here. A score
  # at or below 95% fails the step, but `continue-on-error` keeps the job
  # advisory.
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--diff` needs the base branch's history, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Gremlins derives each mutant's timeout from how long its coverage run
      # took. A cached test result makes that near zero, so nearly every mutant
      # "times out" and the score means nothing.
      - run: go clean -testcache
      - name: Mutate the whole module (push)
        if: github.event_name != 'pull_request'
        run: |
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash .
      - name: Mutate the changed lines (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          status=0
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --diff "origin/$BASE_REF" . > "$RUNNER_TEMP/mutation.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/mutation.log"
          # A diff with no mutable Go line (docs, CI only) yields zero mutants,
          # which gremlins scores as 0% and so fails the threshold. That is not
          # a low score, so treat it as a pass.
          if [ "$status" -ne 0 ] \
            && grep -q '^Killed: 0, Lived: 0, Not covered: 0$' "$RUNNER_TEMP/mutation.log" \
            && grep -q '^Timed out: 0, ' "$RUNNER_TEMP/mutation.log"; then
            echo "No mutants in the changed lines; nothing to test."
            exit 0
          fi
          exit "$status"

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and
      # verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint
