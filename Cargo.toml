[package]
name = "toolward"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MCP proxy that keeps credentials out of agent-readable config files"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
etcetera = "0.11.0"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
keyring-core = "=1.0.0"
rmcp = { version = "3.5.1", features = ["client", "server", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
http = "1.5.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[dev-dependencies]
tempfile = "3.27.0"
