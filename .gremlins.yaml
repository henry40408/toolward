# gremlins v0.6.0 ignores `--threshold-efficacy` on the command line: viper
# returns a float64 flag as a string, which gremlins reads as 0 ("no
# threshold"), so the run always exits 0. The same value from this file is read
# as an integer and works. Keep the threshold here, not on the command line.
unleash:
  threshold:
    efficacy: 95
  exclude-files:
    - '^vendor/'
